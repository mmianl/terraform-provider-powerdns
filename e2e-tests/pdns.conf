# --- Storage (LMDB) ---
launch=lmdb
lmdb-filename=/data/db.lmdb

# --- API / Web server for Terraform tests ---
api=yes
api-key=testapikey
webserver=yes
webserver-address=0.0.0.0
webserver-port=8081
webserver-allow-from=0.0.0.0/0

# --- DNS listener (internal; recursor forwards here) ---
local-address=0.0.0.0
local-port=5300

# --- Sensible test defaults ---
default-ttl=60
primary=yes
version-string=anonymous

# Settings that only exist on some releases live in their own directory, so one
# config file can start every version. PowerDNS refuses to start on an unknown
# setting, and "views" does not exist before 5.0.
include-dir=/etc/powerdns/pdns.d
