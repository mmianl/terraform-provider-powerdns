version: "3.9"

# The version variables exist so this stack can be pointed at another release
# when reproducing a problem. The default pair is deliberately the newest one:
# the Terraform config here uses record comments, which the LMDB backend only
# supports from Authoritative 5.1, so older versions cannot run it unchanged.
# Cross-version coverage lives in the acceptance test matrix instead.
services:
  dbinit:
    image: "powerdns/pdns-auth-${PDNS_AUTH_VERSION:-51}:latest"
    container_name: "pdns-dbinit"
    entrypoint: "/bin/sh"
    user: "root"
    command: >
      -lc '
        set -eu;
        chown -R pdns:pdns /data;
      '
    volumes:
      - "pdns_data:/data"
    restart: "no"

  pdns:
    image: "powerdns/pdns-auth-${PDNS_AUTH_VERSION:-51}:latest"
    container_name: "pdns"
    depends_on:
      dbinit:
        condition: "service_completed_successfully"
    volumes:
      - "pdns_data:/data"
      - "./pdns.conf:/etc/powerdns/pdns.conf:ro"
      - "./${PDNS_CONF_DIR:-pdns.d-views}:/etc/powerdns/pdns.d:ro"
    ports:
      - "5300:5300/udp"
      - "5300:5300/tcp"
      - "8081:8081/tcp"

  pdns-health:
    image: "curlimages/curl:latest"
    container_name: "pdns-health"
    stop_grace_period: "1s"
    depends_on:
      pdns:
        condition: "service_started"
    command: >
      sh -c "
        echo 'Starting PDNS health probe...';
        while true; do
          sleep 60;
        done
      "
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -H 'X-API-Key: testapikey' http://pdns:8081/api/v1/servers >/dev/null 2>&1 || exit 1",
        ]
      interval: "5s"
      timeout: "3s"
      retries: 5

  recursor:
    build:
      context: "."
      dockerfile: "Dockerfile.recursor"
      args:
        RECURSOR_VERSION: "${PDNS_RECURSOR_VERSION:-54}"
    container_name: "recursor"
    depends_on:
      pdns-health:
        condition: "service_healthy"
    volumes:
      - "./recursor.yml:/etc/powerdns/recursor.yml"
    ports:
      - "5301:5301/udp"
      - "5301:5301/tcp"
      - "8082:8082/tcp"

  recursor-health:
    image: "curlimages/curl:latest"
    container_name: "recursor-health"
    stop_grace_period: "1s"
    depends_on:
      recursor:
        condition: "service_started"
    command: >
      sh -c "
        echo 'Starting Recursor health probe...';
        while true; do
          sleep 60;
        done
      "
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -H 'X-API-Key: testapikey' http://recursor:8082/api/v1/servers >/dev/null 2>&1 || exit 1",
        ]
      interval: "5s"
      timeout: "3s"
      retries: 5

  terraform:
    build:
      context: "."
      dockerfile: "Dockerfile.tf"
      args:
        TF_PLUGIN_PLATFORM: ${TF_PLUGIN_PLATFORM:-linux_amd64}
    container_name: "terraform"
    stop_grace_period: 1s
    depends_on:
      recursor-health:
        condition: "service_healthy"
    working_dir: "/tf"
    # Create, assert and delete all resources
    entrypoint:
      - "/bin/sh"
      - "-lc"
      - |
        set -eu

        echo "Current dir: $(pwd)"
        terraform version

        terraform init
        terraform apply -auto-approve

        ./assert.test -test.v

        echo "" > main.tf && echo "" > outputs.tf
        terraform apply -auto-approve
    restart: "no"

volumes:
  pdns_data:
  schema:
