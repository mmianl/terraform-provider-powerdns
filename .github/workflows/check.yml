name: Check

on:
  pull_request:

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.1

      - name: Format
        run: make fmtcheck

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3
  
  mod-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Ensure go.mod tidy and vendor are clean
        run: |
          go mod tidy
          go mod vendor
          if ! git diff --exit-code; then
            echo "ERROR: go.mod, go.sum, or vendor directory are not up-to-date."
            echo "Run: go mod tidy && go mod vendor"
            exit 1
          fi

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.1

      - name: Run Tests
        run: |
          make test

  acc-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Newest pairing, and the only one where every feature is available.
          - pdns-auth: "51"
            pdns-recursor: "54"
            pdns-conf-dir: "pdns.d-views"
          # Views and networks exist here but record comments do not.
          - pdns-auth: "50"
            pdns-recursor: "53"
            pdns-conf-dir: "pdns.d-views"
          # Oldest release the provider is tested against. Views, networks and
          # comments are all absent, so those tests skip themselves.
          - pdns-auth: "49"
            pdns-recursor: "51"
            # 4.9 does not know the "views" setting and refuses to start on it.
            pdns-conf-dir: "pdns.d-empty"
    steps:
      - uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.8"

      - name: Start PowerDNS
        working-directory: acc-tests
        env:
          PDNS_AUTH_VERSION: ${{ matrix.pdns-auth }}
          PDNS_RECURSOR_VERSION: ${{ matrix.pdns-recursor }}
          PDNS_CONF_DIR: ${{ matrix.pdns-conf-dir }}
        run: docker compose up -d

      - name: Wait for PowerDNS to be healthy
        run: |
          while true; do
            STATUS="$(docker inspect --format='{{.State.Health.Status}}' pdns-health 2>/dev/null || echo "starting")"
            if [ "$STATUS" = "healthy" ]; then
              echo "PowerDNS is healthy!"
              break
            fi
            if [ "$STATUS" = "unhealthy" ]; then
              echo "PowerDNS is UNHEALTHY!"
              docker compose -f acc-tests/docker-compose.yml logs
              exit 1
            fi
            sleep 5
          done

      - name: Run Acceptance Tests
        env:
          PDNS_SERVER_URL: http://localhost:8081
          PDNS_RECURSOR_SERVER_URL: http://localhost:8082
          PDNS_API_KEY: testapikey
        run: |
          terraform version
          export TF_ACC_TERRAFORM_PATH="$(which terraform)"
          make testacc

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.1

      - name: Run E2E tests
        timeout-minutes: 2
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o e2e-tests/terraform-provider-powerdns .
          chmod +x e2e-tests/run-e2e-tests.sh
          cd e2e-tests && ./run-e2e-tests.sh
