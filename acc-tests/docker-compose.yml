version: "3.9"

services:
  dbinit:
    image: "powerdns/pdns-auth-${PDNS_AUTH_VERSION:-51}:latest"
    container_name: "pdns-dbinit"
    entrypoint: "/bin/sh"
    user: "root"
    command: >
      -lc '
        set -eu;
        chown -R pdns:pdns /data
      '
    volumes:
      - "pdns_data:/data"
      - "schema:/schema:ro"
    restart: "no"

  pdns:
    image: "powerdns/pdns-auth-${PDNS_AUTH_VERSION:-51}:latest"
    container_name: "pdns"
    depends_on:
      dbinit:
        condition: "service_completed_successfully"
    volumes:
      - "pdns_data:/data"
      - "./pdns.conf:/etc/powerdns/pdns.conf:ro"
      # Views only exist from PowerDNS 5.0, and older releases refuse to start
      # on an unknown setting, so the directory holding it is selected by
      # version. PDNS_CONF_DIR defaults to the one that enables views.
      - "./${PDNS_CONF_DIR:-pdns.d-views}:/etc/powerdns/pdns.d:ro"
    ports:
      - "5300:5300/udp"
      - "5300:5300/tcp"
      - "8081:8081/tcp"

  pdns-health:
    image: "curlimages/curl:latest"
    container_name: "pdns-health"
    stop_grace_period: "1s"
    depends_on:
      pdns:
        condition: "service_started"
    command: >
      sh -c "
        echo 'Starting PDNS health probe...';
        while true; do
          sleep 60;
        done
      "
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -H 'X-API-Key: testapikey' http://pdns:8081/api/v1/servers >/dev/null 2>&1 || exit 1",
        ]
      interval: "5s"
      timeout: "3s"
      retries: 5

  recursor:
    build:
      context: "."
      dockerfile: "Dockerfile.recursor"
      args:
        RECURSOR_VERSION: "${PDNS_RECURSOR_VERSION:-54}"
    container_name: "recursor"
    depends_on:
      pdns-health:
        condition: "service_healthy"
    volumes:
      - "./recursor.yml:/etc/powerdns/recursor.yml"
    ports:
      - "5301:5301/udp"
      - "5301:5301/tcp"
      - "8082:8082/tcp"

  recursor-health:
    image: "curlimages/curl:latest"
    container_name: "recursor-health"
    stop_grace_period: "1s"
    depends_on:
      recursor:
        condition: "service_started"
    command: >
      sh -c "
        echo 'Starting Recursor health probe...';
        while true; do
          sleep 60;
        done
      "
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -H 'X-API-Key: testapikey' http://recursor:8082/api/v1/servers >/dev/null 2>&1 || exit 1",
        ]
      interval: "5s"
      timeout: "3s"
      retries: 5

volumes:
  pdns_data:
  schema:
