# --- Storage (LMDB) ---
launch=lmdb
lmdb-filename=/data/db.lmdb


# --- API / Web server for Terraform tests ---
api=yes
api-key=testapikey
webserver=yes
webserver-address=0.0.0.0
webserver-port=8081
webserver-allow-from=0.0.0.0/0

# --- DNS listener ---
local-address=0.0.0.0
local-port=5300

# --- Sensible test defaults ---
default-ttl=60
primary=yes
version-string=anonymous
views=yes
