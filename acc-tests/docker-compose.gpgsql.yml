version: "3.9"

# An alternative stack that runs the authoritative server on the gpgsql backend
# instead of LMDB. The two backends do not support the same feature set, so a
# suite that only ever runs on one of them cannot see the difference. Use it
# with:
#
#   docker compose -f docker-compose.gpgsql.yml up -d
#
# The acceptance tests detect what the server supports and skip accordingly, so
# the same suite runs against either stack unchanged.

services:
  postgres:
    image: "postgres:17-alpine"
    container_name: "pdns-postgres"
    environment:
      POSTGRES_DB: "pdns"
      POSTGRES_USER: "pdns"
      POSTGRES_PASSWORD: "pdnstest"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdns -d pdns"]
      interval: "3s"
      timeout: "3s"
      retries: 20

  # The schema ships inside the PowerDNS image, so it is loaded from there
  # rather than being copied into this repository and kept in step by hand.
  schema:
    image: "powerdns/pdns-auth-${PDNS_AUTH_VERSION:-51}:latest"
    container_name: "pdns-schema"
    depends_on:
      postgres:
        condition: "service_healthy"
    entrypoint: "/bin/sh"
    user: "root"
    environment:
      PGPASSWORD: "pdnstest"
    command: >
      -lc '
        set -eu;
        apt-get update >/dev/null 2>&1 || true;
        (command -v psql >/dev/null 2>&1 || apt-get install -y --no-install-recommends postgresql-client >/dev/null 2>&1);
        psql -h postgres -U pdns -d pdns -v ON_ERROR_STOP=1 -f /usr/local/share/doc/pdns/schema.pgsql.sql;
        echo "schema loaded"
      '
    restart: "no"

  pdns:
    image: "powerdns/pdns-auth-${PDNS_AUTH_VERSION:-51}:latest"
    container_name: "pdns"
    depends_on:
      schema:
        condition: "service_completed_successfully"
    volumes:
      - "./pdns-gpgsql.conf:/etc/powerdns/pdns.conf:ro"
    ports:
      - "5300:5300/udp"
      - "5300:5300/tcp"
      - "8081:8081/tcp"

  pdns-health:
    image: "curlimages/curl:latest"
    container_name: "pdns-health"
    stop_grace_period: "1s"
    depends_on:
      pdns:
        condition: "service_started"
    command: >
      sh -c "
        echo 'Starting PDNS health probe...';
        while true; do
          sleep 60;
        done
      "
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -H 'X-API-Key: testapikey' http://pdns:8081/api/v1/servers >/dev/null 2>&1 || exit 1",
        ]
      interval: "5s"
      timeout: "3s"
      retries: 5

  recursor:
    build:
      context: "."
      dockerfile: "Dockerfile.recursor"
    container_name: "recursor"
    depends_on:
      pdns-health:
        condition: "service_healthy"
    volumes:
      - "./recursor.yml:/etc/powerdns/recursor.yml"
    ports:
      - "5301:5301/udp"
      - "5301:5301/tcp"
      - "8082:8082/tcp"

  recursor-health:
    image: "curlimages/curl:latest"
    container_name: "recursor-health"
    stop_grace_period: "1s"
    depends_on:
      recursor:
        condition: "service_started"
    command: >
      sh -c "
        echo 'Starting Recursor health probe...';
        while true; do
          sleep 60;
        done
      "
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -H 'X-API-Key: testapikey' http://recursor:8082/api/v1/servers >/dev/null 2>&1 || exit 1",
        ]
      interval: "5s"
      timeout: "3s"
      retries: 5
